# p-IB-n device: test of IBBeerLambert with overlapping sigma_CI and sigma_IV.
# AM1.5G illumination, short-circuit only (V=0).
#
# Band structure: E_g = 2.0 eV, E_IB = 1.2 eV
#   CI sub-gap: E_CI = 0.8 eV  (IB->CB, sigma nonzero for all E >= 0.8 eV)
#   IV sub-gap: E_IV = 1.2 eV  (VB->IB, sigma nonzero for all E >= 1.2 eV)
# sigma_CI and sigma_IV overlap for E >= 1.2 eV (physically correct: a photon
# in that range can drive either transition).

layers:
- name: fsf
  thickness: {value: 0.05, unit: um}
  mesh: {start: 0.005, factor: 1.2}
  properties:
    poisson/static_rho: {value: -1.0e+19, unit: elementary_charge/cm^3}
- name: p
  thickness: {value: 1.0, unit: um}
  mesh: {start: 0.005, factor: 1.2}
  properties:
    poisson/static_rho: {value: -1.0e+17, unit: elementary_charge/cm^3}
- name: I
  thickness: {value: 3.0, unit: um}
  mesh: {start: 0.01, factor: 1.3}
  properties:
    poisson/static_rho: {value: 1.25e17, unit: elementary_charge/cm^3}
    nr_top/sigma_th: {value: 5.0e-18, unit: cm^2}
    nr_top/v_th:     {value: 2.0e7,   unit: cm/s}
    nr_bottom/sigma_th: {value: 5.0e-18, unit: cm^2}
    nr_bottom/v_th:     {value: 2.0e7,   unit: cm/s}
    IB/number_of_states: {value: 2.5e17, unit: cm^-3}
    IB/mobility0:        {value: 500.0,  unit: cm^2/V/s}
    IB/simple_mobility_model: {value: true, unit: ''}
    # B2B relaxation lifts the IB continuity null space.
    ib_cb_relax/IB/tau: {value: 1.0e-9, unit: s}
- name: n
  thickness: {value: 1.0, unit: um}
  mesh: {start: 0.005, factor: 1.2}
  properties:
    poisson/static_rho: {value: 1.0e17, unit: elementary_charge/cm^3}

regions:
- name: domain
  properties:
    temperature: {value: 300.0, unit: K}
    CB/energy_level: {value: 2.0, unit: eV}
    VB/energy_level: {value: 0.0, unit: eV}
    IB/energy_level: {value: 1.2, unit: eV}
    CB/effective_density_of_states: {value: 2.0e19, unit: cm^-3}
    VB/effective_density_of_states: {value: 2.0e19, unit: cm^-3}
    CB/mobility: {value: 500.0, unit: cm^2/V/s}
    VB/mobility: {value: 500.0, unit: cm^2/V/s}
    poisson/permittivity: {value: 13.0, unit: vacuum_permittivity}
    IB/degeneracy: {value: 1, unit: ''}
    refractive_index: {value: 3.5, unit: ''}
    # Constant alpha for VB->CB (used by NonOverlappingTopHatBeerLambert opt_cv)
    opt_cv/alpha: {value: 1.0e4, unit: cm^-1}

bands:
- name: CB
  type: nondegenerate
  sign: -1
  extent: all
- name: IB
  type: intermediate
  sign: -1
  extent: [I]
- name: VB
  type: nondegenerate
  sign: 1
  extent: all

processes:
# IB->CB: sigma nonzero for E >= E_CI = 0.8 eV, extends to infinity.
- class: IBBeerLambert
  name: opt_ci
  dst_band: CB
  src_band: IB
  trap_band: IB
  radiative_recombination:
    integration_bins: 50
    E_min: {value: 0.8, unit: eV}
    E_max: {value: 4.0, unit: eV}
  sigma:
    I:
      top_hat:
        E_low:  {value: 0.8, unit: eV}
        E_high: {value: .inf, unit: eV}
        value: 3.0e-14
        unit: cm^2

# VB->IB: sigma nonzero for E >= E_IV = 1.2 eV, extends to infinity.
# Overlaps with sigma_CI for E >= 1.2 eV.
- class: IBBeerLambert
  name: opt_iv
  dst_band: IB
  src_band: VB
  trap_band: IB
  radiative_recombination:
    integration_bins: 50
    E_min: {value: 1.2, unit: eV}
    E_max: {value: 4.0, unit: eV}
  sigma:
    I:
      top_hat:
        E_low:  {value: 1.2, unit: eV}
        E_high: {value: .inf, unit: eV}
        value: 3.0e-14
        unit: cm^2

# VB->CB: constant alpha clipped to E >= E_g = 2.0 eV by absorption bounds.
- class: NonOverlappingTopHatBeerLambert
  name: opt_cv
  dst_band: CB
  src_band: VB
  radiative_recombination: false

# NR traps: necessary to keep IB continuity well-conditioned.
- class: NonRadiativeTrap
  name: nr_top
  dst_band: CB
  src_band: IB
  trap_band: IB
- class: NonRadiativeTrap
  name: nr_bottom
  dst_band: IB
  src_band: VB
  trap_band: IB

# B2B relaxation: lifts the IB null space so MUMPS can factorise.
- class: ShockleyReadBand2BandTrap
  name: ib_cb_relax
  dst_band: IB
  src_band: CB

optical_field_sets:
- name_prefix: sun
  direction: +x
  N_bins: 5
  E_min: {value: 0.8, unit: eV}
  E_max: {value: 4.0, unit: eV}
  spectrum: am15g

contacts:
  left:
    role: swept
    bands:
      CB: zero_current
      IB: ohmic
      VB: ohmic
  right:
    role: reference
    bands:
      CB: ohmic
      IB: ohmic
      VB: zero_current

simulation:
  intensity_ramp:
    enabled: true
    selfconsistent_optics: false
    step_size: 1.0e-25
  voltage_sweep:
    enabled: true
    values: [0.0]
    selfconsistent_optics: true
    step_size: 0.0001
  output:
    spatial_profiles: true
    xdmf_mesh: false
  checkpoints:
    intensity_ramp:
      checkpoint_at_end: false
      at_values: []
    voltage_sweep:
      checkpoint_at_end: false
      at_values: []
    directory: checkpoints

output:
  folder: out/test_ib_beer_lambert

mesh:
  max_edge_length: 0.02
